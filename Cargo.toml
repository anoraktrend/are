[package]
name = "are"
version = "1.2.2"
edition = "2021"
description = "Another Rust Editor - A port of the aee terminal-based text editor to Rust"
license = "Artistic-2.0"
authors = ["Converted from C to Rust"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
tokio = { version = "1.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
crossterm = "0.27"
arborium = { version = "2.16", features = ["lang-rust", "lang-c", "lang-cpp", "lang-python", "lang-bash", "lang-toml"] }
